<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — W-Dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050507">
<script>
  // на github pages сайт может лежать в подпапке, поэтому задаём базовый путь
  var seg = location.pathname.split("/")[1];
  document.write('<base href="' + (location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/") + '">');
</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className += " js";</script>
</head>
<body data-page="404">
<div id="site-header"></div>
<main id="main">
  <div class="nf">
    <div>
      <h1 data-split>404</h1>
      <p data-reveal style="--d:.6s">Такой страницы нет. Возможно, ссылка устарела.</p>
      <a class="btn" href="index.html" data-reveal style="--d:.8s">На главную</a>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
