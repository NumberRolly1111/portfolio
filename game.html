<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка — GwebStudio</title>
<meta name="description" content="Мини-игра на сайте GwebStudio: змейка, в которой нужно собирать значки технологий.">
<meta name="theme-color" content="#050507">
<link rel="canonical" href="https://portfolio.w-smp.in/game">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&family=Unbounded:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className += " js";</script>
</head>
<body data-page="game">
<script>try{if(!sessionStorage.getItem("gws")){sessionStorage.setItem("gws","1");document.write('<div class="intro" aria-hidden="true"><span>G<i>web</i>Studio</span></div>');}}catch(e){}</script>
<div id="site-header"></div>

<main id="main">
  <div class="page-hero">
    <div class="wrap" data-bg="Игра">
      <h1 data-split>Змейка</h1>
      <p data-reveal style="--d:.4s">Собирай значки технологий, на которых я делаю сайты. Чем больше собрано, тем быстрее змейка.</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="game" id="game" data-reveal>
        <div class="game-bar"><span><i>Счёт</i> <b id="g-score">0</b></span><span><i>Рекорд</i> <b id="g-best">0</b></span></div>
        <div class="game-field">
          <canvas id="g-canvas" width="600" height="600" aria-label="Змейка"></canvas>
          <div class="game-over" id="g-overlay">
            <h2 id="g-title">Змейка</h2>
            <p id="g-text">Управление: стрелки или WASD, пробел для паузы. На телефоне свайп по полю.</p>
            <button class="btn light" type="button" id="g-btn">Играть</button>
          </div>
        </div>
        <div class="dpad" aria-hidden="true">
          <button type="button" data-d="up">↑</button>
          <button type="button" data-d="left">←</button>
          <button type="button" data-d="down">↓</button>
          <button type="button" data-d="right">→</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="js/game.js"></script>
</body>
</html>
